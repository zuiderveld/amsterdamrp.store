<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onderhoud | Amsterdam Roleplay</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-t.png" />
  <style>
    :root {
      --bg: #070b14;
      --fg: #d9d9d9;
      --muted: #808080;
      --accent-blue: #3b82f6;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at top, rgba(59,130,246,.15), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(132,204,22,.08), transparent 45%),
        var(--bg);
      padding: 2rem;
      text-align: center;
    }
    img { height: 72px; width: auto; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 .75rem; }
    p { color: var(--muted); max-width: 28rem; margin: 0 auto 1.5rem; line-height: 1.5; }
    .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.2rem;
      border-radius: .5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: .9rem;
    }
    .primary {
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      color: white;
    }
    .ghost {
      border: 1px solid #1e293b;
      color: var(--fg);
      background: rgba(16,24,40,.6);
    }
  </style>
</head>
<body>
  <div>
    <img src="/assets/img/logo-t.png" alt="Amsterdam Roleplay" />
    <h1>Website in onderhoud</h1>
    <p id="msg">We zijn even bezig met onderhoud. Kom zo terug!</p>
    <div class="actions">
      <a class="primary" href="https://discord.gg/rRSeCBb25A" target="_blank" rel="noreferrer">Discord</a>
      <a class="ghost" href="/admin">Admin login</a>
    </div>
  </div>
  <script>
    fetch("/api/site/public-config").then(r => r.json()).then(d => {
      if (d.maintenanceMessage) document.getElementById("msg").textContent = d.maintenanceMessage;
    }).catch(() => {});
  </script>
</body>
</html>
